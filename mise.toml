[tools]
"pipx:okf-ingest" = "0.11.0"
uv = "0.12.4"

[tasks.lint]
description = "Run all checks"
depends = ['validate', 'test']

[tasks.validate]
description = "Validate the OKF v0.2 catalog"
run = "okf validate catalog/"

[tasks.test]
description = "Run MCP unit tests"
run = "uv run --project mcp python -m unittest discover -s mcp/tests -v"
