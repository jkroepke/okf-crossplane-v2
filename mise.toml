[tools]
"pipx:okf-ingest" = "0.13.1"
uv = "0.13.9"

[tasks.lint]
description = "Run all checks"
depends = ['validate', 'test']

[tasks.validate]
description = "Validate the OKF v0.3 catalog"
run = [
  "uv run --project mcp python scripts/okf-validate.py --strict catalog/",
  "okf validate catalog/",
]

[tasks.test]
description = "Run MCP unit tests"
run = "uv run --project mcp python -m unittest discover -s mcp/tests -v"
