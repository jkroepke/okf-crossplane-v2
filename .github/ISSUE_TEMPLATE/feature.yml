name: Feature request
description: Ask for new catalog coverage or an improvement to the MCP server or skill.
title: "[Feature]: "
type: Feature
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project should change?
      options:
        - Catalog content (catalog/)
        - MCP server (mcp/)
        - Skill or plugin (skills/, .plugin/, .codex-plugin/)
        - Other
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: What would you like?
      description: Describe the topic, function, provider, or capability you want covered or added.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Why is it useful?
      description: The use case or question this would help answer.
  - type: textarea
    id: sources
    attributes:
      label: Sources
      description: Upstream repositories, docs, or releases that the change should be based on.
